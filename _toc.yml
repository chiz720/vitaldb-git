  # ============================================================
  - caption: "Part I — Foundations: Learning the Language of Data"
    numbered: true
    chapters:

      # ----------------------------------------------------------
      # Chapter 1 — Why Quantitative Anesthesia?
      # ----------------------------------------------------------
      - file: notebooks/part1_foundations/ch01_why_quantitative    # [PLANNED]
        title: "Chapter 1 — Why Quantitative Anesthesia?"
        sections:
          - file: vitaldb_analysis                                  # [EXISTS] VitalDB dataset overview & EDA
            title: "1.1 · The VitalDB Dataset: Your Laboratory"
          - file: asa_mortality                                      # [EXISTS] ASA class vs. mortality
            title: "1.2 · ASA Classification and Mortality: A First Look"

      # ----------------------------------------------------------
      # Chapter 2 — Types of Variables
      # ----------------------------------------------------------
