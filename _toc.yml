#==============================================================================
# Quantitative Anesthesia — Table of Contents
# Format: jb-book (Jupyter Book >= 0.15)
#
# Legend:
#   [EXISTS]  notebook already written and in repo
#   [PLANNED] file to be created — listed for structure; build with
#             `only_build_toc_files: true` in _config.yml so missing files
#             do not break the build once stubs are created.
#
# Naming convention:
#   Root-level notebooks  → referenced by filename only (no path prefix)
#   New chapter notebooks → notebooks/partN_name/chNN_slug
#   Appendices            → appendices/appendix_X_slug
#==============================================================================

format: jb-book
root: intro          # intro.md — book landing page [PLANNED]

parts:

  # ============================================================
